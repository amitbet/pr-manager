name: Release
# Pushes to main are versioned and published by CI. This workflow publishes a
# tag pushed from outside Actions, such as a minor or major bump. A tag CI
# creates with GITHUB_TOKEN does not start this workflow.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    name: Desktop build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
            test_tags: desktop
            output: dist/desktop/PR-Manager-macos-arm64.zip
          - os: ubuntu-24.04
            artifact: linux-amd64
            test_tags: desktop,webkit2_41
            output: dist/desktop/pr-manager-linux-amd64.tar.gz
          - os: windows-latest
            artifact: windows-amd64
            test_tags: desktop
            output: dist/desktop/pr-manager-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      DESKTOP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test cgo parser and app
        if: runner.os != 'Windows'
        shell: bash
        run: go test -tags '${{ matrix.test_tags }}' ./...
      - name: Build desktop app
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-desktop.sh
      - name: Build desktop app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-desktop.sh
      - name: Test cgo parser and app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test -tags desktop ./...
      - uses: actions/upload-artifact@v4
        with:
          name: pr-manager-desktop-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UI JavaScript
        run: bash scripts/check-ui.sh
      - name: Test
        run: |
          go vet ./...
          go test ./...
          go build -o "$RUNNER_TEMP/pr-manager" .
          python3 scripts/smoke-release.py "$RUNNER_TEMP/pr-manager"
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-manager-desktop-*
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Verify desktop packages
        run: |
          test -s "$RUNNER_TEMP/desktop-release/PR-Manager-macos-arm64.zip"
          test -s "$RUNNER_TEMP/desktop-release/pr-manager-linux-amd64.tar.gz"
          test -s "$RUNNER_TEMP/desktop-release/pr-manager-windows-amd64.exe"
          cd "$RUNNER_TEMP/desktop-release"
          sha256sum PR-Manager-macos-arm64.zip pr-manager-linux-amd64.tar.gz pr-manager-windows-amd64.exe > desktop-checksums.txt
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Publishes the archives and commits Casks/pr-manager.rb to main, which
      # makes this repository its own Homebrew tap.
      - uses: goreleaser/goreleaser-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload desktop packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/desktop-release/PR-Manager-macos-arm64.zip" \
            "$RUNNER_TEMP/desktop-release/pr-manager-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/desktop-release/pr-manager-windows-amd64.exe" \
            "$RUNNER_TEMP/desktop-release/desktop-checksums.txt" \
            --clobber
      # Casks/** and bucket/** changes do not trigger CI, so these commits do
      # not start a new release.
      - name: Update Scoop manifests and desktop Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GoReleaser is skipped when the release already exists, so read the
          # CLI checksums from the release instead of dist/.
          gh release download "$RELEASE_TAG" -p checksums.txt -D "$RUNNER_TEMP" --clobber
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p Casks bucket
            bash scripts/desktop-cask.sh "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/PR-Manager-macos-arm64.zip" > Casks/pr-manager-desktop.rb
            bash scripts/scoop-manifest.sh cli "$RELEASE_TAG" "$RUNNER_TEMP/checksums.txt" > bucket/pr-manager.json
            bash scripts/scoop-manifest.sh desktop "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/pr-manager-windows-amd64.exe" "$RUNNER_TEMP/checksums.txt" > bucket/pr-manager-desktop.json
            git add Casks/pr-manager-desktop.rb bucket/pr-manager.json bucket/pr-manager-desktop.json
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Homebrew cask and Scoop manifests for $RELEASE_TAG"
            git push origin main && exit 0
            sleep 5
          done
          exit 1
