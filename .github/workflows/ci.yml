name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['Casks/**', 'bucket/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Queue pushes to main so each one is tagged and released in order.
  # Pull requests still cancel the previous run.
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  version:
    name: Resolve version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve next release tag
        id: tag
        run: |
          git fetch origin --tags --force
          tag=$(bash scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release is $tag" >> "$GITHUB_STEP_SUMMARY"
  snapshot:
    name: CLI snapshot and serve check
    needs: version
    if: always() && !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Test version bump
        run: bash scripts/next-version-test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UI JavaScript
        run: bash scripts/check-ui.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # A separate cache from the desktop jobs. They finish first and would
      # otherwise save a cache without the cross-compiled packages. When the
      # key changes, restore-keys starts from the last CLI cache instead of
      # rebuilding all six targets from scratch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cli-${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          restore-keys: cli-${{ runner.os }}-${{ runner.arch }}-go-
      - name: Vet and test pure Go path
        run: go vet ./... && go test ./...
      - name: Smoke-test serve
        run: |
          go build -o "$RUNNER_TEMP/pr-manager" .
          python3 scripts/smoke-release.py "$RUNNER_TEMP/pr-manager"
      # On main, build the real release so the release job only publishes it.
      # The tag stays local until the release job pushes it.
      - name: Tag the release locally
        if: env.RELEASE_TAG != ''
        run: |
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag "$RELEASE_TAG"
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: ${{ env.RELEASE_TAG != '' && 'release --clean --skip=publish' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: cli-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/CHANGELOG.md
            dist/homebrew/Casks/pr-manager.rb
          if-no-files-found: error
  # macOS and Linux build apart from Windows so their packages, checksums and
  # Homebrew cask publish without waiting on the slower, flakier Windows job.
  desktop:
    name: Desktop build (${{ matrix.artifact }})
    needs: version
    if: always() && !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
            test_tags: desktop
            output: dist/desktop/PR-Manager-macos-arm64.zip
          - os: ubuntu-24.04
            artifact: linux-amd64
            test_tags: desktop,webkit2_41
            output: dist/desktop/pr-manager-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    # Each build uploads its package to the release as soon as it is ready.
    permissions:
      contents: write
      actions: read
    env:
      CGO_ENABLED: 1
      DESKTOP_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Test cgo parser and app
        run: go test -tags '${{ matrix.test_tags }}' ./...
      - name: Build desktop app
        run: bash scripts/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pr-manager-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
      - name: Upload to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/upload-desktop-release.sh "$RELEASE_TAG" '${{ matrix.output }}'
  desktop-windows:
    name: Desktop build (windows-amd64)
    needs: version
    if: always() && !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      CGO_ENABLED: 1
      DESKTOP_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build desktop app
        shell: msys2 {0}
        run: bash scripts/build-desktop.sh
      - name: Test cgo parser and app
        shell: msys2 {0}
        run: go test -tags desktop ./...
      - uses: actions/upload-artifact@v4
        with:
          name: pr-manager-windows-amd64
          path: dist/desktop/pr-manager-windows-amd64.exe
          if-no-files-found: error
      - name: Upload to release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/upload-desktop-release.sh "$RELEASE_TAG" dist/desktop/pr-manager-windows-amd64.exe
  release:
    name: Release
    needs: [version, snapshot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.result == 'success' && needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: ${{ runner.temp }}/cli-release
      - name: Verify release packages
        run: |
          test -s "$RUNNER_TEMP/cli-release/checksums.txt"
          test -s "$RUNNER_TEMP/cli-release/homebrew/Casks/pr-manager.rb"
          cd "$RUNNER_TEMP/cli-release" && sha256sum -c checksums.txt
      - name: Bump version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          [[ -n "$tag" ]]
          git fetch origin --tags --force
          expected=$(bash scripts/next-version.sh)
          if [[ "$expected" != "$tag" ]]; then
            echo "version changed from $tag to $expected while builds were running" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            if [[ "$(git rev-parse "${tag}^{}")" != "$(git rev-parse HEAD)" ]]; then
              echo "tag $tag already points at a different commit" >&2
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/${tag}"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/cli-release/CHANGELOG.md" "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP"/cli-release/*.tar.gz \
            "$RUNNER_TEMP"/cli-release/*.zip \
            "$RUNNER_TEMP/cli-release/checksums.txt" \
            --clobber
      # Casks/** and bucket/** changes do not trigger CI, so this commit does
      # not start a new release.
      - name: Update CLI Homebrew cask and Scoop manifest
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p Casks bucket
            cp "$RUNNER_TEMP/cli-release/homebrew/Casks/pr-manager.rb" Casks/pr-manager.rb
            bash scripts/scoop-manifest.sh cli "$RELEASE_TAG" "$RUNNER_TEMP/cli-release/checksums.txt" > bucket/pr-manager.json
            git add Casks/pr-manager.rb bucket/pr-manager.json
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Homebrew cask and Scoop manifest for pr-manager $RELEASE_TAG"
            git push origin main && exit 0
            sleep 5
          done
          exit 1
  desktop-release:
    name: Desktop checksums and cask
    needs: [version, release, desktop]
    if: always() && !cancelled() && needs.release.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with desktop-windows-release: both rewrite desktop-checksums.txt.
    concurrency:
      group: desktop-checksums-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-manager-*
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Publish desktop checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          bash scripts/desktop-checksums.sh "$RELEASE_TAG" \
            "$RUNNER_TEMP/desktop-release/PR-Manager-macos-arm64.zip" \
            "$RUNNER_TEMP/desktop-release/pr-manager-linux-amd64.tar.gz"
      # Casks/** and bucket/** changes do not trigger CI, so this commit does
      # not start a new release.
      - name: Update desktop Homebrew cask
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p Casks
            bash scripts/desktop-cask.sh "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/PR-Manager-macos-arm64.zip" > Casks/pr-manager-desktop.rb
            git add Casks/pr-manager-desktop.rb
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Homebrew cask for pr-manager-desktop $RELEASE_TAG"
            git push origin main && exit 0
            sleep 5
          done
          exit 1
  desktop-windows-release:
    name: Desktop Windows checksum and Scoop manifest
    needs: [version, release, desktop-windows]
    if: always() && !cancelled() && needs.release.result == 'success' && needs.desktop-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-checksums-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pr-manager-windows-amd64
          path: ${{ runner.temp }}/desktop-release
      - name: Publish desktop checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/desktop-checksums.sh "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/pr-manager-windows-amd64.exe"
      # Casks/** and bucket/** changes do not trigger CI, so this commit does
      # not start a new release.
      - name: Update desktop Scoop manifest
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # The Scoop desktop manifest also installs the CLI archive.
          gh release download "$RELEASE_TAG" -p checksums.txt -D "$RUNNER_TEMP" --clobber
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p bucket
            bash scripts/scoop-manifest.sh desktop "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/pr-manager-windows-amd64.exe" "$RUNNER_TEMP/checksums.txt" > bucket/pr-manager-desktop.json
            git add bucket/pr-manager-desktop.json
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Scoop manifest for pr-manager-desktop $RELEASE_TAG"
            git push origin main && exit 0
            sleep 5
          done
          exit 1
