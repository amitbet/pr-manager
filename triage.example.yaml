# Copy to <repo>/.triage.yaml. Lists are appended to the built-in defaults
# (see triage/policy.go DefaultPolicy).
generated:
  - "api/openapi/*.gen.go"
force_human:
  - "internal/billing/**"
  - "pkg/recommendation/**"
thresholds:
  none: 0.9      # min confidence to accept "none", else -> skim
  skim: 0.7   # min confidence to accept "skim", else -> human
max_unit_chars: 24000
# Other units' diffs shown with each unit in the review prompt, most related first.
review_context_chars: 32000
# Review related units together in one call instead of one call each: units
# that name each other, a test named after the symbol it exercises, and small
# changes in the same file. On by default; -group-review=false also turns it
# off for a run.
classify_batch:
  max_units: 6        # units per classify call (1: one call per unit)
  max_chars: 16000    # cap on one call's combined diff
grouping:
  enabled: true
  max_chars: 12000    # cap on one group's combined diff
  max_members: 8      # cap on units per group (0: no cap). Both caps were
                      # picked by experiments/grouping-tuning; without the
                      # member cap a chain of links can pull 20+ units into
                      # one review, and those reviews report less.
# Static analysis over the lines the PR adds (triage/lint.go). Findings go
# to the reviewer as facts it is told not to repeat, raise the unit's
# likelihood, and appear on the Issues tab where they can be dismissed.
lint:
  enabled: true
  # Empty: run every known linter the repo is configured for and that is
  # installed. Naming tools runs exactly those, config or not.
  # tools: [golangci-lint, eslint, ruff, shellcheck]
  # skip: [eslint]
  secrets: true       # built-in credential scan; needs nothing installed
  timeout_sec: 120    # per tool
  max_per_unit: 10    # findings carried into one unit's prompt (0: no cap)
# Buckets come from one score per unit (see README, Tiers):
#   prior = sqrt(impact x likelihood) x change-kind weight
#   score = max(review attention, prior x (1 - trust)) after a clean review
# The review budget picks how much a clean review is trusted and the cut-offs.
tiers:
  review_budget: balanced     # most | more | balanced | less | least (-review-budget overrides)
  # Override single fields of a step:
  # budgets:
  #   balanced: { trust: 0.3, human: 40, skim: 15 }
  #   least:    { trust: 0.6, human: 50, skim: 20, lift_floors: true }
  # lift_floors: a clean review lets units held at skim (behavior changes,
  # risk signals) drop to none. On by default for less and least.
  # kind_weights: { test: 0.8, refactor: 0.6 }
  critical_impact: 85         # units at or above always go to human (0: off)
